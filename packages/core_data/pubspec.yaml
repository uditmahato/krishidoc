name: core_data
description: Pure Dart data layer for KrishiDoc V2. Drift/SQLite local store (D-10) implementing the core_domain ports. No Flutter imports (D-42); platform executors are injected by the app.
publish_to: none
version: 0.1.0
resolution: workspace
environment:
  sdk: ^3.8.0
dependencies:
  core_domain: ^0.1.0
  drift: ^2.20.0
  sqlite3: ^2.4.0
  uuid: ^4.4.0
dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: ^2.20.0
  lints: ^5.0.0
  test: ^1.25.0
