name: ci

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  repo-hygiene:
    name: repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: forbid tracked artifacts and secret-shaped files
        run: |
          set -e
          violations=$(git ls-files | grep -E '(^|/)(build|\.dart_tool|__pycache__|\.terraform)(/|$)|\.(jks|keystore|pem|p12|tfstate)$|(^|/)(\.env(\..*)?|key\.properties|google-services\.json|GoogleService-Info\.plist)$' || true)
          if [ -n "$violations" ]; then
            echo "Forbidden files tracked in git:"; echo "$violations"; exit 1
          fi
      - name: ADR index exists and is non-empty
        run: test -s docs/adr/ADR-INDEX.md
      - name: Living Project Memory exists
        run: test -s docs/PROJECT_MEMORY.md

  dart:
    name: dart (format, analyze, purity, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.8.1"
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed packages
      - run: dart analyze --fatal-infos
      - name: no Flutter imports in pure core packages (D-42)
        run: |
          if grep -rn "package:flutter" packages/core_domain/lib packages/core_domain/test; then
            echo "core packages must stay Flutter-free (D-42)"; exit 1
          fi
      - run: dart test
        working-directory: packages/core_domain

  python:
    name: python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q

# OpenAPI diff, budget, and eval-harness jobs are added by the modules that
# create the artifacts they check.
