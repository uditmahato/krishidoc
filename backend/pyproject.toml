[project]
name = "krishidoc-backend"
version = "0.1.0"
description = "KrishiDoc V2 backend: FastAPI modular monolith (D-26)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krishidoc"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20"]  # T20 bans print (D-38)

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["krishidoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=krishidoc --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["src/krishidoc"]
