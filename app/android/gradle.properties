# The Flutter template asks for -Xmx8G plus a 4G metaspace, which exceeds
# available memory on an ordinary developer machine mid-session and on
# standard CI runners; the daemon is then killed and the build fails with a
# misleading "daemon disappeared". These values build this project fine.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
